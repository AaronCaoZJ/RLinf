defaults:
  - model/pi0@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-5  # 使用全部 6 张 H200，不需要 env 和 rollout 组件

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf_blockpap_mix_sft
    experiment_name: "test_openpi0.5"
    logger_backends: ["wandb"] # wandb, swanlab
    wandb_entity: "aaroncaozj_team"  # WandB entity/team name

  max_epochs: 30000
  max_steps: -1
  val_check_interval: -1
  save_interval: 4000

data:
  train_data_paths: "../mg_dataset"

algorithm:
  adv_type: gae

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 16  # 6xH200 显存充裕，从8提升到16
  global_batch_size: 96  # 6 GPUs * 16 = 96，无需梯度累积
  seed: 0

  # Override the default values in model/pi0
  model:
    # is_lora: True
    # lora_rank: 32
    precision: null
    model_path: "../hf_download/models/pi05_base"
    num_action_chunks: 8 # interface for the env
    add_value_head: False
    openpi:
      config_name: "pi05_blockpap_mix"
      detach_critic_input: True

  optim:
    lr: 2.5e-5
    value_lr: 1.55e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    warmup_style: "cosine"
    lr_warmup_steps: 1000
    total_training_steps: 30000  # for lr scheduler cosine decay

  # Override the default values in training_backend/fsdp
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"  # 每卡保留完整模型，通信开销最小
    use_orig_params: True
    gradient_checkpointing: False # for openpi, gradient checkpointing is not supported, please do not change this value
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False