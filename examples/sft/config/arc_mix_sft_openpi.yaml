defaults:
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 2,3,4,5  # 使用全部 6 张 H200，不需要 env 和 rollout 组件

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf_blockpap_mix_sft
    experiment_name: "new_norm_stats_stride2"
    logger_backends: ["wandb"] # wandb, swanlab
    wandb_entity: "aaroncaozj_team"  # WandB entity/team name

  max_epochs: 100000
  max_steps: -1
  val_check_interval: -1
  save_interval: 5000

data:
  train_data_paths: "../mg_dataset"
  num_real_episodes: 50    # first N episodes in the merged dataset are real demos
  co_training_ratio: 0.5   # alpha: probability of sampling from sim episodes (0=real only, 1=sim only)
  apply_sim_bias: false    # apply z+0.1m / yaw-45° bias to sim episodes; set false to disable
  image_input_views: ["image", "wrist_image"]
  debug_image_input_selection: true  # log selected image views during training
  debug_image_input_log_every: 200   # print every N samples (worker-0)
  sim_image_aug: false      # apply ColorJitter+RandomPerspective to sim image/back_image

algorithm:
  adv_type: gae

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32
  global_batch_size: 128
  seed: 0

  # Override the default values in model/pi0
  model:
    # is_lora: True
    # lora_rank: 32
    precision: null
    model_path: "../hf_download/models/pi05_base"
    num_action_chunks: 8 # interface for the env
    num_steps: 5
    add_value_head: False
    openpi:
      config_name: "pi05_blockpap_mix"
      num_images_in_input: 2
      detach_critic_input: True
      # Temporal subsampling stride for action sequences.
      # stride=1: disabled (use original 20Hz data as-is)
      # stride=2: each token covers 2 frames → effective 10Hz, 8 tokens span 0.8s
      # stride=4: each token covers 4 frames → effective 5Hz,  8 tokens span 1.6s
      # num_action_chunks does NOT need to change; stride only changes the time gap between tokens.
      action_subsample_stride: 2

  optim:
    lr: 2.5e-5
    value_lr: 1.55e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    warmup_style: "cosine"
    lr_warmup_steps: 1000
    total_training_steps: 30000  # for lr scheduler cosine decay

  # Override the default values in training_backend/fsdp
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"  # 每卡保留完整模型，通信开销最小
    use_orig_params: True
    gradient_checkpointing: False # for openpi, gradient checkpointing is not supported, please do not change this value
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False